version: 2

builds:
  - binary: bkup
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: bkup
    repository:
      owner: tungwu1230
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/tungwu1230/bkup
    description: Back up a folder into a tar.gz archive, honoring its root .gitignore
    commit_msg_template: "Update {{ .ProjectName }} to {{ .Tag }}"
    # The binary is not signed/notarized with an Apple developer ID, so strip
    # the quarantine bit Gatekeeper would otherwise enforce on cask installs.
    #
    # `hooks.post.install` emits Homebrew's now-deprecated `postflight do...end`
    # block, which prints a warning on every `brew` invocation. GoReleaser is
    # adding a replacement (`hooks.post.install_steps`, using Homebrew's
    # declarative step DSL) in https://github.com/goreleaser/goreleaser/pull/6873
    # (closes https://github.com/goreleaser/goreleaser/issues/6870). Migrate to
    # `install_steps` once that ships.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/bkup"]
          end
